# ci.yml
# Runs on every push to main and on pull requests.
# Tests both macOS (native) and Linux (Docker container).
#
# MDNSApple is guarded by #if canImport(Network) throughout, so it compiles
# to an empty module on Linux — no skip needed; swift test just reports 0
# tests for MDNSAppleTests on that platform.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── macOS ──────────────────────────────────────────────────────────────────
  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  # ── Apple platform floors ──────────────────────────────────────────────────
  # Build-only cross-compiles that validate the platform floors declared in
  # Package.swift. Catches APIs that are unavailable on a platform (e.g.
  # NetService on watchOS) or newer than a declared floor — neither of which
  # the native macOS build can see.
  #
  # Versionless triples pick up the deployment target from Package.swift.
  # visionOS needs an explicit version in the triple because SwiftPM
  # synthesizes an invalid default (xros10.13) for a versionless xros triple;
  # keep it in sync with the .visionOS floor in Package.swift.
  apple-platforms:
    name: ${{ matrix.platform.name }} (build only)
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: iOS,      triple: arm64-apple-ios,      sdk: iphoneos }
          - { name: tvOS,     triple: arm64-apple-tvos,     sdk: appletvos }
          - { name: watchOS,  triple: arm64-apple-watchos,  sdk: watchos }
          - { name: visionOS, triple: arm64-apple-xros1.0,  sdk: xros }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: >
          swift build
          --triple ${{ matrix.platform.triple }}
          --sdk "$(xcrun --sdk ${{ matrix.platform.sdk }} --show-sdk-path)"

  # ── Linux ──────────────────────────────────────────────────────────────────
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: swift:6.2-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build
        run: swift build

      - name: Test
        run: swift test
